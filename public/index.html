<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SYNTRIX – Live Event Scoreboard</title>
<style>
:root{--bg:#0a0a0b;--p:#141416;--l:#26262a;--r:#c8102e;--t:#f4f4f5;--m:#9a9aa3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 "Segoe UI",system-ui,sans-serif;min-height:100vh}
body::before{content:"SYNTRIX";position:fixed;inset:0;display:grid;place-items:center;font:900 20vw/1 Impact,"Arial Black",sans-serif;letter-spacing:.05em;opacity:.03;transform:rotate(-12deg);pointer-events:none}
body::after{content:"";position:fixed;left:0;right:0;top:0;height:240px;background:radial-gradient(60% 100% at 50% 0,rgba(200,16,46,.16),transparent);pointer-events:none}
header,main{position:relative;z-index:1;max-width:1400px;margin:auto;padding:.8rem 1rem}
header{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;border-bottom:2px solid var(--r)}
.logo{width:46px;height:46px;border:2px solid var(--r);display:grid;place-items:center;font:900 1.1rem Impact,sans-serif;letter-spacing:.05em}
.brand{font:900 1.5rem Impact,"Arial Black",sans-serif;letter-spacing:.14em}.brand small{display:block;font:500 .65rem "Segoe UI",sans-serif;letter-spacing:.2em;color:var(--m)}
nav{display:flex;flex-wrap:wrap;gap:.2rem;margin-left:auto}nav a{color:var(--m);text-decoration:none;padding:.4rem .7rem;border-bottom:2px solid transparent}nav a:hover,nav a.on{color:var(--t);border-color:var(--r)}
h1{font-size:1.7rem;margin:.6rem 0}h2{font-size:1.1rem;letter-spacing:.1em;text-transform:uppercase;margin:1.6rem 0 .6rem;border-left:3px solid var(--r);padding-left:.6rem}
.m{color:var(--m)}.hd{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:center}
.c{background:var(--p);border:1px solid var(--l);padding:1rem}.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;margin:1rem 0}.g4 b{display:block;font-size:1.7rem;margin-top:.3rem}
.row,.tools{display:flex;flex-wrap:wrap;gap:.8rem;align-items:end;margin:.8rem 0}label{display:grid;gap:.25rem;font-size:.8rem;color:var(--m)}
input,select,textarea{background:#0e0e10;border:1px solid #3a3a40;color:var(--t);padding:.5rem .6rem;font:inherit;border-radius:2px}input.s{width:100%;max-width:340px;margin:.4rem 0}
input:focus,select:focus,.b:focus-visible,a:focus-visible{outline:2px solid var(--r);outline-offset:1px}
.b{background:var(--r);color:#fff;border:1px solid var(--r);padding:.55rem 1rem;font:inherit;font-weight:600;cursor:pointer;border-radius:2px;text-decoration:none;display:inline-block}.b:hover{filter:brightness(1.15)}.b.g{background:transparent;border-color:#444;color:var(--t)}.b.sm{padding:.2rem .6rem;font-size:.85rem}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--m);border-bottom:2px solid var(--r);padding:.6rem}td{padding:.6rem;border-bottom:1px solid var(--l)}.n{text-align:right}th.n small{color:#666}
tbody tr:hover{background:#18181b}tr.r1{background:rgba(200,16,46,.24)}tr.r2{background:rgba(200,16,46,.15)}tr.r3{background:rgba(200,16,46,.08)}.rk{font-weight:800;font-size:1.2em}
td input{width:90px;text-align:right}td input.t{width:100%;min-width:140px;text-align:left}
.big td{font-size:clamp(1.1rem,2.3vw,2.2rem);padding:.7rem}.big th{font-size:clamp(.7rem,1.1vw,1rem)}
.top3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem;margin:1rem 0}.top3 div{border:1px solid var(--l);border-top:3px solid var(--r);background:var(--p);padding:.8rem 1rem}.top3 b{display:block;font-size:clamp(1.2rem,2.6vw,2.2rem)}.top3 span{font-size:clamp(1.8rem,3.4vw,3rem);font-weight:900}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:#222;border-left:4px solid #3ba55c;padding:.7rem 1.2rem;z-index:9;display:none}#toast.bad{border-color:var(--r)}
.st{color:var(--r)}body.board nav a:not(.keep){display:none}
@media print{body{background:#fff;color:#000}body::before,body::after,header nav,.np{display:none}th,td,.m{color:#000}tr.r1,tr.r2,tr.r3{background:#eee}}
</style></head><body><header><div class="logo" aria-label="Event logo placeholder">SX</div><div class="brand">SYNTRIX<small>LIVE EVENT SCOREBOARD</small></div><nav id="nav" aria-label="Main"></nav></header><main id="app">Loading…</main><div id="toast" role="status"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),f=n=>Math.round(n*100)/100;
let S={teams:[],rounds:[],scores:[],settings:{},me:null,ok:false},B={rounds:true,compact:false},dirty={},rdirty={},q='';
async function api(p,o={}){const r=await fetch('/api/'+p,{method:o.method||'GET',headers:{'Content-Type':'application/json'},body:o.body?JSON.stringify(o.body):undefined});const d=(r.headers.get('content-type')||'').includes('json')?await r.json():await r.text();if(!r.ok)throw new Error(d.error||'Request failed');return d}
let tt;function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3500)}
const go=fn=>async(...a)=>{try{await fn(...a)}catch(x){toast(x.message==='Failed to fetch'?'Network error – check your connection':x.message,1)}};
const typing=()=>/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&!location.hash.includes('board');
async function load(force){try{Object.assign(S,await api('public'),{ok:true,me:(await api('me')).user})}catch(x){toast('Cannot reach server – retrying',1);return}if(force||!typing())render()}
function rows(){const m={};S.scores.forEach(s=>m[s.team_id+'_'+s.round_id]=s.marks);const mx=S.rounds.reduce((a,r)=>a+r.max_marks,0),prev=JSON.parse(S.settings.prev_ranks||'{}');
const a=S.teams.map(t=>({...t,tot:f(S.rounds.reduce((x,r)=>x+(m[t.id+'_'+r.id]||0),0))})).sort((x,y)=>y.tot-x.tot);a.forEach((t,i)=>{t.rank=i&&a[i-1].tot===t.tot?a[i-1].rank:i+1;t.pct=mx?t.tot/mx*100:0;t.mv=prev[t.id]?prev[t.id]-t.rank:0});return{a,m,mx}}
function tbl(a,m,mx,rs,cp,big){if(!a.length)return'<p class="m">No teams yet.</p>';return`<div class="sc"><table class="${big?'big':''}"><thead><tr><th>Rank<th>Team${rs?S.rounds.map(r=>`<th class="n">${e(r.name)} <small>/${r.max_marks}</small>`).join(''):''}<th class="n">Total${cp?'':'<th class="n">Max<th class="n">Score %<th>Move'}</tr></thead><tbody>${a.map(t=>`<tr class="r${t.rank<4?t.rank:''}"><td class="rk">${t.rank}<td><b>${e(t.name)}</b> <span class="m">#${e(t.number)}</span>${rs?S.rounds.map(r=>`<td class="n">${m[t.id+'_'+r.id]??'—'}`).join(''):''}<td class="n"><b>${t.tot}</b>${cp?'':`<td class="n m">${f(mx)}<td class="n">${t.pct.toFixed(1)}%<td>${t.mv>0?'▲'+t.mv:t.mv<0?'▼'+-t.mv:'–'}`}</tr>`).join('')}</tbody></table></div>`}
function home(){const{a}=rows(),lead=a[0]&&a[0].tot>0?a.filter(t=>t.rank===1).map(t=>t.name).join(', '):'—';
return`<div class="hd"><div><h1>${e(S.settings.event_name||'SYNTRIX')}</h1><p class="m">Event status: <b class="st">${e(S.settings.event_status||'Upcoming')}</b></p></div><a class="b" href="#/board">Open Live Leaderboard</a></div>
<div class="g4">${[['Teams',S.teams.length],['Rounds',S.rounds.length],['Completed rounds',S.rounds.filter(r=>r.status==='completed').length],['Current leader',lead]].map(([k,v])=>`<div class="c"><span class="m">${k}</span><b>${e(v)}</b></div>`).join('')}</div>
${S.me?`<h2>Admin tools</h2><div class="c tools"><label>Event status<select onchange="setStatus(this.value)">${['Upcoming','Live','Completed'].map(x=>`<option ${S.settings.event_status===x?'selected':''}>${x}</option>`).join('')}</select></label>
<a class="b g" href="/api/export.csv" download>Export CSV</a><a class="b g" href="/api/backup" download>Backup</a><label class="b g">Restore backup<input type="file" accept=".json" hidden onchange="restore(this)"></label>
<button class="b g" onclick="reset('scores')">Reset scores</button><button class="b g" onclick="reset('all')">Remove all teams, rounds &amp; scores</button></div><h2>Leaderboard preview</h2>${(r=>tbl(r.a.slice(0,5),r.m,r.mx,0,1))(rows())}`:'<p class="m">Organizer? <a href="#/login" style="color:var(--t)">Admin login</a></p>'}`}
const setStatus=go(async v=>{await api('settings',{method:'PUT',body:{event_status:v}});toast('Status updated');load(1)});
const reset=go(async mode=>{if(prompt(mode==='all'?'This deletes ALL teams, rounds and scores. Type RESET to continue:':'This clears all scores and history. Type RESET to continue:')!=='RESET')return;await api('reset',{method:'POST',body:{mode,confirm:'RESET'}});toast('Done');load(1)});
const restore=go(async i=>{const fl=i.files[0];if(!fl)return;if(prompt('Restore replaces ALL current data. Type RESTORE to continue:')!=='RESTORE'){i.value='';return}await api('restore',{method:'POST',body:{data:JSON.parse(await fl.text())}});toast('Backup restored');load(1)});
function tlist(){const k=q.toLowerCase();const l=S.teams.filter(t=>(t.name+' '+t.number).toLowerCase().includes(k));return l.length?l.map(t=>`<tr><td>${e(t.number)}<td>${e(t.name)}<td class="n"><button class="b g sm" onclick="editTeam(${t.id})">Edit</button> <button class="b g sm" onclick="delTeam(${t.id})">Delete</button></tr>`).join(''):'<tr><td colspan="3" class="m">No teams found.</tr>'}
function teamNoInput(input){const value=input.value;input.value=value.replace(/[^0-9]/g,'');$('#teamNoError').textContent=value!==input.value?'Team number must contain digits only.':''}
function teams(){return`<h1>Teams <span class="m">(${S.teams.length} registered)</span></h1><form class="c row" onsubmit="saveTeam(event);return false"><input type="hidden" id="tid"><label>Team no.<input id="tno" type="text" inputmode="numeric" required maxlength="10" oninput="teamNoInput(this)"><small id="teamNoError" class="m" aria-live="polite"></small></label><label>Team name<input id="tnm" required maxlength="60"></label><button class="b">Save team</button><button type="button" class="b g" onclick="this.form.reset();$('#tid').value='';$('#teamNoError').textContent=''">Clear</button></form>
<input class="s" placeholder="Search teams" aria-label="Search teams" value="${e(q)}" oninput="q=this.value;$('#tl').innerHTML=tlist()"><div class="sc"><table><thead><tr><th>No.<th>Name<th></tr></thead><tbody id="tl">${tlist()}</tbody></table></div>`}
const saveTeam=go(async ev=>{ev.preventDefault();const id=$('#tid').value,number=$('#tno').value.trim(),name=$('#tnm').value.trim();if(!/^\d+$/.test(number)){$('#teamNoError').textContent='Team number must contain digits only.';$('#tno').focus();return}$('#teamNoError').textContent='';const duplicate=S.teams.find(t=>String(t.id)!==id&&(t.number===number||t.name===name));if(duplicate){toast(duplicate.number===number?'Team number already exists':'Team name already exists',1);return}await api('teams'+(id?'/'+id:''),{method:id?'PUT':'POST',body:{number,name}});toast('Team saved');await load(1)});
function editTeam(id){const t=S.teams.find(x=>x.id===id);$('#tid').value=id;$('#tno').value=t.number;$('#tnm').value=t.name;$('#teamNoError').textContent='';$('#tno').focus()}
const delTeam=go(async id=>{const t=S.teams.find(x=>x.id===id);if(!confirm(`Delete ${t.name}? Their scores will be removed.`))return;await api('teams/'+id,{method:'DELETE'});toast('Team deleted');load(1)});
function rounds(){return`<h1>Rounds <span class="m">(${S.rounds.length})</span></h1><form class="c row" onsubmit="saveRound(event);return false"><input type="hidden" id="rid"><label>Round name<input id="rnm" required maxlength="60" placeholder="e.g. Coding"></label><label>Max marks<input id="rmx" type="number" min="0.01" step="any" required></label><label>Status<select id="rst"><option value="active">Active</option><option value="completed">Completed</option></select></label><button class="b">Save round</button><button type="button" class="b g" onclick="this.form.reset();$('#rid').value=''">Clear</button></form>
<div class="sc"><table><thead><tr><th>#<th>Name<th class="n">Max marks<th>Status<th></tr></thead><tbody>${S.rounds.length?S.rounds.map((r,i)=>`<tr><td>${i+1}<td>${e(r.name)}<td class="n">${r.max_marks}<td>${r.status}<td class="n"><button class="b g sm" onclick="editRound(${r.id})">Edit</button> <button class="b g sm" onclick="delRound(${r.id})">Delete</button></tr>`).join(''):'<tr><td colspan="5" class="m">No rounds yet.</tr>'}</tbody></table></div>`}
const saveRound=go(async ev=>{ev.preventDefault();const id=$('#rid').value;await api('rounds'+(id?'/'+id:''),{method:id?'PUT':'POST',body:{name:$('#rnm').value,max_marks:$('#rmx').value,status:$('#rst').value}});toast('Round saved');await load(1)});
function editRound(id){const r=S.rounds.find(x=>x.id===id);$('#rid').value=id;$('#rnm').value=r.name;$('#rmx').value=r.max_marks;$('#rst').value=r.status;$('#rnm').focus()}
const delRound=go(async id=>{const r=S.rounds.find(x=>x.id===id);if(!confirm(`Delete round "${r.name}" and all its marks?`))return;await api('rounds/'+id,{method:'DELETE'});toast('Round deleted');load(1)});
function marks(){const{a,m}=rows(),tot={};a.forEach(t=>tot[t.id]=t.tot);if(!S.teams.length||!S.rounds.length)return'<h1>Marks entry</h1><p class="m">Add at least one team and one round first.</p>';
return`<div class="hd"><h1>Marks entry</h1><div><span id="stat" class="m"></span> <button class="b" onclick="saveMarks()">Save changes</button></div></div><p class="m">Leave a cell blank for “no marks”. Decimals allowed.</p><div class="sc"><table><thead><tr><th>Team${S.rounds.map(r=>`<th class="n">${e(r.name)} <small>/${r.max_marks}${r.status==='completed'?' ✓':''}</small>`).join('')}<th class="n">Total<th>Judge remarks</tr></thead><tbody>${S.teams.map(t=>`<tr><td><b>${e(t.name)}</b> <span class="m">#${e(t.number)}</span>${S.rounds.map(r=>{const k=t.id+'_'+r.id;return`<td class="n"><input type="number" step="any" min="0" max="${r.max_marks}" data-k="${k}" aria-label="${e(t.name)} ${e(r.name)}" value="${dirty[k]!==undefined?e(dirty[k]):m[k]??''}" oninput="dirty[this.dataset.k]=this.value;stat()">`}).join('')}<td class="n"><b>${tot[t.id]}</b><td><input class="t" maxlength="300" value="${e(rdirty[t.id]??t.remarks)}" oninput="rdirty[${t.id}]=this.value;stat()"></tr>`).join('')}</tbody></table></div><h2>Score change history</h2><div class="sc" id="hist"></div>`}
function stat(){const n=Object.keys(dirty).length+Object.keys(rdirty).length;$('#stat').textContent=n?`${n} unsaved change(s)`:'All changes saved';$('#stat').style.color=n?'var(--r)':''}
const saveMarks=go(async()=>{const en=[];for(const k in dirty){const[t,r]=k.split('_').map(Number),v=dirty[k].trim(),rd=S.rounds.find(x=>x.id===r);if(v!==''&&!(+v>=0&&+v<=rd.max_marks))throw new Error(`Marks must be between 0 and ${rd.max_marks} (${rd.name})`);en.push({team_id:t,round_id:r,marks:v===''?null:+v})}
const n=en.length+Object.keys(rdirty).length;if(!n)return toast('Nothing to save');if(n>1&&!confirm(`Apply ${n} changes?`))return;await api('scores',{method:'PUT',body:{entries:en,remarks:rdirty}});dirty={};rdirty={};toast('Scores saved');await load(1)});
const hist=go(async()=>{const h=await api('history');$('#hist').innerHTML=h.length?`<table><thead><tr><th>Time<th>Team<th>Round<th class="n">Previous<th class="n">New<th>By</tr></thead><tbody>${h.map(x=>`<tr><td>${new Date(x.at).toLocaleString()}<td>${e(x.team_label)}<td>${e(x.round_label)}<td class="n">${x.old_marks??'—'}<td class="n">${x.new_marks??'—'}<td>${e(x.admin)}</tr>`).join('')}</tbody></table>`:'<p class="m">No score changes yet.</p>'});
const tog=k=>{B[k]=!B[k];render()};
function boardPage(){const{a,m,mx}=rows(),rs=B.rounds&&!B.compact;return`<div class="hd np"><a class="b g keep" href="#/">← Exit</a><span><button class="b g" onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()">Full screen</button> <button class="b g" onclick="tog('rounds')">Round marks: ${B.rounds?'On':'Off'}</button> <button class="b g" onclick="tog('compact')">Totals only: ${B.compact?'On':'Off'}</button></span></div>
<div class="hd"><h1 style="font-size:clamp(1.8rem,4vw,3.4rem);letter-spacing:.08em">${e(S.settings.event_name||'SYNTRIX')} — LIVE LEADERBOARD</h1><b class="st" style="font-size:clamp(1rem,2vw,1.6rem)">● ${e((S.settings.event_status||'Upcoming').toUpperCase())}</b></div>
<div class="top3">${a.slice(0,3).map(t=>`<div><span>${t.rank}</span><b>${e(t.name)}</b><span class="m" style="font-size:1rem">#${e(t.number)} · ${t.tot} pts</span></div>`).join('')}</div>${tbl(a.slice(0,10),m,mx,rs,B.compact,1)}`}
function results(){const{a,m,mx}=rows();return`<div class="hd"><h1>Final results</h1><div class="np"><button class="b" onclick="print()">Print</button> ${S.me?'<a class="b g" href="/api/export.csv" download>Export CSV</a>':''}</div></div><p class="m">${e(S.settings.event_name||'SYNTRIX')} · ${new Date().toLocaleDateString()}</p>${tbl(a,m,mx,1,0)}`}
function login(){return`<h1>Admin login</h1><form class="c row" onsubmit="doLogin(event);return false"><label>Username<input id="lu" autocomplete="username" required></label><label>Password<input id="lp" type="password" autocomplete="current-password" required></label><button class="b">Log in</button></form>`}
const doLogin=go(async ev=>{ev.preventDefault();await api('login',{method:'POST',body:{username:$('#lu').value,password:$('#lp').value}});await load(1);location.hash='#/'});
const logout=go(async()=>{await api('logout',{method:'POST'});S.me=null;location.hash='#/';render()});
const P={'':home,teams,rounds,marks,board:boardPage,results,login},ADM=['teams','rounds','marks'];
function render(){const p=location.hash.slice(2)||'';document.body.classList.toggle('board',p==='board');if(!S.ok){return}
if(ADM.includes(p)&&!S.me){location.hash='#/login';return}
$('#nav').innerHTML=`<a class="keep ${p===''?'on':''}" href="#/">Dashboard</a>${S.me?['teams','rounds','marks'].map(x=>`<a class="${p===x?'on':''}" href="#/${x}">${x[0].toUpperCase()+x.slice(1)}</a>`).join(''):''}<a class="keep ${p==='board'?'on':''}" href="#/board">Leaderboard</a><a class="${p==='results'?'on':''}" href="#/results">Results</a>${S.me?'<a href="#" onclick="logout();return false">Logout</a>':`<a class="${p==='login'?'on':''}" href="#/login">Admin</a>`}`;
$('#app').innerHTML=(P[p]||home)();if(p==='marks'){stat();hist()}}
addEventListener('hashchange',()=>render());
const sk=io();sk.on('update',()=>load());sk.on('connect',()=>load());setInterval(()=>load(),15000);load(1);
</script></body></html>
